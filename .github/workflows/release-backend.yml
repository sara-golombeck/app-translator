name: Backend Release

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'backend/VERSION'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Read version
        id: version
        run: |
          VERSION=$(cat backend/VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "🚀 Releasing version: $VERSION"
      
      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "backend-v${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️  Tag already exists!"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Set up Docker Buildx
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3
      
      - name: Login to DockerHub
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            sara3259/app-translator-backend:latest
            sara3259/app-translator-backend:v${{ steps.version.outputs.VERSION }}
            sara3259/app-translator-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Create and push git tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "backend-v${{ steps.version.outputs.VERSION }}" -m "Backend release v${{ steps.version.outputs.VERSION }}"
          git push origin "backend-v${{ steps.version.outputs.VERSION }}"
          echo "✅ Tag created and pushed!"
