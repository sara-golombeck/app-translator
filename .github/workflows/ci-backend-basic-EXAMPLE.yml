name: Backend CI Basic

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: # TODO: הוסף כאן את ה-secret
          password: # TODO: הוסף כאן את ה-secret
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            YOUR_USERNAME/app-translator-backend:latest
