name: Frontend CI

on:
  push:
    branches: [main, develop, ci/cd]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'


jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Run frontend unit tests
        working-directory: ./frontend
        run: node script.test.js
      
      - name: Validate HTML structure
        working-directory: ./frontend
        run: |
          echo "Checking HTML structure..."
          grep -q "<html" index.html && echo "✅ HTML tag found"
          grep -q "translateBtn" index.html && echo "✅ Translate button found"
          grep -q "source" index.html && echo "✅ Source textarea found"
      
      - name: Test summary
        run: echo "✅ Unit tests passed!"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: sara3259/app-translator-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      
      - name: Test Docker image
        run: |
          docker run --rm sara3259/app-translator-frontend:${{ github.sha }} nginx -v
          echo "✅ Docker image works!"

  push:
    name: Push to DockerHub
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/cd')
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            sara3259/app-translator-frontend:latest
            sara3259/app-translator-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
