name: Frontend CI/CD

on:
  push:
    branches: [main, develop, ci/cd]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify files
        run: |
          ls -la frontend/
          echo "✅ Frontend files ready!"

  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/cd')
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      
      - name: Sync to S3
        run: |
          aws s3 sync frontend/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete \
            --exclude "*.test.js" \
            --exclude "Dockerfile" \
            --exclude ".dockerignore" \
            --exclude "nginx*.conf"
          echo "✅ Deployed to S3!"
      
      - name: Set content types
        run: |
          aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --content-type "text/html" --metadata-directive REPLACE
          aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/script.js \
            s3://${{ secrets.S3_BUCKET_NAME }}/script.js \
            --content-type "application/javascript" --metadata-directive REPLACE
          echo "✅ Content types set!"
